services:
  resend-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resend-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/mailer.db
      - GDRIVE_SERVICE_ACCOUNT_JSON=/app/data/gdrive-service-account.json
