{{define "content"}}
<div style="max-width: 420px; margin: 4rem auto;">
  <div class="md-card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <span class="material-symbols-outlined" style="font-size: 3rem; color: var(--md-sys-color-primary);">lock</span>
      <h1 style="font-size: 1.5rem; margin-top: 0.5rem; font-weight: 700;">ログイン</h1>
      <p style="font-size: 0.875rem; color: var(--md-sys-color-on-surface-variant); margin-top: 0.25rem;">
        Resend Server 管理画面
      </p>
    </div>

    {{if .Error}}
    <div class="md-alert md-alert-error">
      <span class="material-symbols-outlined">error</span>
      <span>{{.Error}}</span>
    </div>
    {{end}}

    <form action="/login" method="POST">
      <div class="md-form-group">
        <label class="md-label" for="username">ユーザー名</label>
        <input class="md-input" type="text" id="username" name="username" required autofocus autocomplete="username" placeholder="admin">
      </div>

      <div class="md-form-group">
        <label class="md-label" for="password">パスワード</label>
        <input class="md-input" type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="md-btn md-btn-primary" style="width: 100%;">
          <span class="material-symbols-outlined">login</span>
          <span>ログイン</span>
        </button>
      </div>
    </form>
  </div>
</div>
{{end}}
