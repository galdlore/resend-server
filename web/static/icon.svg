<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景プレート -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- メール封筒 -->
  <g filter="url(#shadow)">
    <!-- 封筒本体の背景 -->
    <rect x="80" y="140" width="352" height="232" rx="28" fill="url(#inner)"/>

    <!-- 封筒のライン（V字） -->
    <path d="M 88 152 L 256 280 L 424 152" fill="none" stroke="#2563eb" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 封筒の下部折り目ライン -->
    <path d="M 88 360 L 204 252" fill="none" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
    <path d="M 424 360 L 308 252" fill="none" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>

    <!-- 送信アクセント（右上） -->
    <circle cx="396" cy="132" r="48" fill="#10b981"/>
    <path d="M 376 132 L 390 146 L 418 118" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

